services:
  astral-relay:
    build: .
    container_name: astral-relay
    # Run as the host user that owns the bind mounts, rather than root.
    #
    # Two things break otherwise. Content committed into the publishing checkout
    # would be written root-owned, so editing it on the host afterwards needs
    # sudo. And git refuses to operate on a repository owned by somebody else --
    # "detected dubious ownership" -- which would fail every publish as soon as
    # git sync is enabled.
    #
    # Everything written lives in the two bind mounts (/app/data, /workspace);
    # nothing in the image itself is written at runtime.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      # Loopback ONLY. The nginx vhost on the tailnet IP is the sole way in; a
      # 0.0.0.0 publish here would hand the whole LAN a route that skips it.
      - "127.0.0.1:3031:3031"
    volumes:
      - ./data:/app/data
      # Host path to your Astro site; set HOST_WORKSPACE_PATH in .env
      #
      # Point this at a checkout dedicated to publishing, pinned to the branch
      # the site is built from -- NOT at a development tree. The CMS commits
      # whatever branch that checkout has out, so sharing it with a working copy
      # means publishes land on whichever feature branch happened to be checked
      # out at the time.
      #
      # Mount the REPOSITORY ROOT, not the Astro directory inside it. Git needs
      # to find .git by walking up, and in a monorepo (apps/site/...) mounting
      # the site directory alone leaves the container with "not a git
      # repository". Use WORKSPACE_PATH to point at the Astro root within it.
      - ${HOST_WORKSPACE_PATH:?set HOST_WORKSPACE_PATH in .env to your site repository root}:/workspace
      # Deploy key for pushing content. Read-only mount: the container needs to
      # read the key, never to alter it.
      - ${HOST_GIT_SSH_KEY_PATH:-/dev/null}:/run/secrets/git_ssh_key:ro
    environment:
      - NODE_ENV=production
      - PORT=3031
      - DB_PATH=/app/data/relay.db
      # The Astro root inside the mounted repository. Defaults to the mount
      # itself, which is right for a single-app repo; a monorepo sets this to
      # e.g. /workspace/apps/site.
      - WORKSPACE_PATH=${WORKSPACE_PATH:-/workspace}
      - SESSION_SECRET=${SESSION_SECRET:-change-me-to-a-random-secret}
      # Publishing writes content into the mounted workspace and pushes it to
      # GIT_BRANCH, which is the branch the host builds the live site from.
      # Off by default so a fresh copy of this file cannot start pushing to
      # somebody's repository on first publish.
      - GIT_SYNC_ENABLED=${GIT_SYNC_ENABLED:-false}
      - GIT_BRANCH=${GIT_BRANCH:-main}
      - GIT_SSH_KEY_PATH=${HOST_GIT_SSH_KEY_PATH:+/run/secrets/git_ssh_key}
      - WEBHOOK_URL=
      # Both default to the SAFE value, so copying this file does not silently
      # weaken a TLS deployment. This install overrides COOKIE_SECURE=false in
      # .env, because it is served as plain HTTP behind a tailnet-bound nginx
      # vhost: there is no TLS for a Secure cookie to ride on, the browser would
      # discard it, and WireGuard already encrypts the only path to the port.
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      # Same-origin UI, so the deployment sets its own origin in .env. Empty
      # means same-origin only in production.
      - FRONTEND_ORIGINS=${FRONTEND_ORIGINS:-}
      # Off by default in production; this install opts in via .env because it is
      # reachable only over the tailnet.
      - API_DOCS=${API_DOCS:-false}
    restart: unless-stopped
