name: CI

on:
  push:
    branches: [ main, pipelines ]
  # No base-branch filter. Filtering by base meant a PR targeting anything other
  # than main never ran CI at all -- a stack of five PRs reached merge-ready
  # having only been tested locally, and the gap was invisible because the
  # checks list simply showed nothing rather than showing a failure.
  pull_request:

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18 is the floor claimed by package.json engines, 20 is what the
        # Dockerfile ships, 22 is what development runs on. CI previously tested
        # only 18 -- neither of the versions the app actually runs under -- which
        # is how a test script that worked on 18 and failed on 22 went unnoticed.
        node: [18, 20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Upload logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-node${{ matrix.node }}
          path: |
            npm-debug.log
            ./**/coverage
            ./**/test-results
