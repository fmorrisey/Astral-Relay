name: CD

on:
  push:
    branches: [ main ]
  # Manual re-run, for when a deploy needs repeating without a new commit.
  workflow_dispatch:

# One deploy at a time. Two overlapping runs would race on the same working copy
# and the same container.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Rainier
    runs-on: ubuntu-latest
    steps:
      # Checked before the tailnet step so a missing credential says what to do,
      # rather than surfacing as an authentication failure from inside an action.
      - name: Check deploy credentials are configured
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          missing=()
          for name in TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET DEPLOY_SSH_KEY DEPLOY_HOST_KEY; do
            [ -z "${!name:-}" ] && missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}"
            echo "See 'Continuous deployment' in the README. The Tailscale pair comes from an"
            echo "OAuth client with the auth_keys scope, owning the tag:ci ACL tag."
            exit 1
          fi

      # A GitHub-hosted runner rather than a self-hosted one. This repository is
      # public, and a self-hosted runner would put workflow code proposed by pull
      # requests on the machine that holds the tailnet, the site source and the
      # database. Nothing untrusted runs on the target here -- the runner only
      # opens an SSH connection to it.
      #
      # The host has no public route: rainierserver.com resolves to Cloudflare,
      # and its SSH is reachable only over the tailnet. So the runner joins the
      # tailnet as an ephemeral node for the length of the job.
      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # The step above cannot be relied on to fail. It retries `tailscale up` in a
      # loop whose last command is a `sleep`, so when every attempt fails -- a 403
      # from an OAuth client missing the auth_keys scope, say -- the loop still
      # exits 0 and the step is reported green. The deploy then dies further along
      # at an SSH connection timeout, which says nothing about the real cause.
      - name: Verify the tailnet connection came up
        run: |
          set -euo pipefail

          # Tolerate the binary being absent or the daemon not answering: an
          # empty state falls through to the same readable failure below.
          state="$(tailscale status --json 2>/dev/null | jq -r '.BackendState' || true)"
          if [ "$state" != "Running" ]; then
            echo "::error::Not connected to the tailnet (BackendState=$state)."
            echo "Read the retry output of 'Join the tailnet' above. A 403 there"
            echo "means the Tailscale OAuth client either lacks the writable"
            echo "auth_keys scope or does not own tag:ci."
            exit 1
          fi

      - name: Deploy over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          set -euo pipefail

          for required in DEPLOY_HOST DEPLOY_USER; do
            if [ -z "${!required:-}" ]; then
              echo "::error::$required is not set. See 'Continuous deployment' in the README."
              exit 1
            fi
          done

          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Pin the host key. The alternative, StrictHostKeyChecking=no, would
          # hand the deploy key to whatever answers on that address.
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # The command sent is ignored: the key is pinned to a forced command in
          # authorized_keys, so this connection can only run a deploy and not a
          # shell. Sending one anyway keeps the intent readable in the logs.
          ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=30 \
              "$DEPLOY_USER@$DEPLOY_HOST" astral-relay-deploy
