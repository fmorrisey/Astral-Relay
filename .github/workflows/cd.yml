name: CD

on:
  push:
    branches: [ main ]
  # Manual re-run, for when a deploy needs repeating without a new commit.
  workflow_dispatch:

# One deploy at a time. Two overlapping runs would race on the same working copy
# and the same container.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Rainier
    # The runner lives on the target, so there is nothing to connect to: no
    # tailnet to join, no SSH hop, and no deploy credentials to hold. This is how
    # Spokerv2 already deploys to this same host.
    #
    # This repository is public, which is usually the argument against a
    # self-hosted runner: for `pull_request` events GitHub builds the workflow
    # from the PR head, so a fork could aim a job at this machine. Nothing here
    # is PR-triggered -- CD runs only on a push to main or a manual dispatch,
    # both of which need write access -- and CI runs on GitHub-hosted runners.
    # Keep it that way: a `pull_request` trigger on this workflow, or any
    # self-hosted job in ci.yml, would undo that reasoning.
    runs-on: self-hosted

    steps:
      # The installed copy, deliberately, rather than scripts/deploy.sh from the
      # tree. The script git-resets the very checkout it would be running from,
      # and bash reads a script incrementally as it executes -- so running the
      # in-tree copy risks the file changing underneath the interpreter partway
      # through a deploy. Keeping the executed copy outside the repository also
      # means "can merge to main" does not silently mean "can run anything on
      # this host".
      #
      # Re-run this after changing scripts/deploy.sh:
      #   install -Dm755 scripts/deploy.sh ~/.local/bin/astral-relay-deploy
      - name: Deploy
        run: |
          set -euo pipefail

          DEPLOY_BIN="$HOME/.local/bin/astral-relay-deploy"

          if [ ! -x "$DEPLOY_BIN" ]; then
            echo "::error::$DEPLOY_BIN is missing or not executable. Install it with:"
            echo "  install -Dm755 scripts/deploy.sh ~/.local/bin/astral-relay-deploy"
            echo "See 'Continuous deployment' in the README."
            exit 1
          fi

          "$DEPLOY_BIN"
